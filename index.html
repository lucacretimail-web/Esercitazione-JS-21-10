<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week Project — Settimana III</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <!-- Titolo dell'app -->
    <h1>Le mie cose da fare</h1>
  </header>

  <main>

    <section class="form">
      <!-- Form di inserimento di nuovi elementi -->
      <form id="form">
        <input id="testo" placeholder="Cosa devi fare?">
        <button>Aggiungi</button>
      </form>
    </section>

    <section class="controlli">
      <!-- Filtro: Tutti, Attivi, Completati -->
      <button data-filtro="tutti">Tutti</button>
      <button data-filtro="attivi">Attivi</button>
      <button data-filtro="completati">Completati</button>
    </section>

    <ul class="lista" id="lista">
      <!-- Container che render() ricostruisce a ogni cambio di stato -->
    </ul>

    <section class="statistiche" id="statistiche">
      <!-- Conteggi -->
    </section>

    <div id="notifica"></div>

  </main>

  <script src="script esercizi 21:10.js"></script>
</body>
</html>
